<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Fish Tank - Erin Hayward-Lang</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        (function () {
            var mode = localStorage.getItem('darkMode');
            if (mode === 'enabled' || (mode === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div id="navbar-placeholder"></div>

    <div class="back-link">
        <a href="../index.html">← Back to Home</a>
    </div>

    <main id="main-content" tabindex="-1">
        <section>
            <h1>🐠 Virtual Fish Tank</h1>
            <p>Click anywhere in the tank to add a fish!</p>
            
            <div id="fish-tank" class="fish-tank">
                <!-- Fish will be added here dynamically -->
            </div>
            
            <div class="tank-controls">
                <button id="addFishBtn" class="tank-btn">Add Random Fish</button>
                <button id="clearTankBtn" class="tank-btn">Clear Tank</button>
                <span id="fishCount" class="fish-count">Fish: 0</span>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../index.js" defer></script>
    <script src="../js/fish-tank.js" defer></script>
</body>
</html>
