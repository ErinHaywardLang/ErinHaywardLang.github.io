<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erin Hayward-Lang: A vibe coding journey</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        (function () {
            var mode = localStorage.getItem('darkMode');
            if (mode === 'enabled' || (mode === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="back-link">
        <a href="../index.html">← Back to Blog</a>
    </div>

    <main>
        <article class="blog-post">
            <header class="post-header">
                <p class="post-date">21 January 2026</p>
            </header>

            <div class="post-content" id="post-content">
                <!-- Content loaded from Markdown -->
            </div>
        </article>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../../index.js" defer></script>
    <script>
        async function loadBlogPost() {
            try {
                const response = await fetch('blog-post-1.md');
                const markdown = await response.text();
                const html = marked.parse(markdown);
                document.getElementById('post-content').innerHTML = html;
            } catch (error) {
                console.error('Error loading blog post:', error);
                document.getElementById('post-content').innerHTML = '<p>Error loading blog post.</p>';
            }
        }
        loadBlogPost();
    </script>
</body>
</html>
